name: Publish hologram

# Unpacks any .zip in the repository (and copies any loose .html files) and publishes the result with GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Unpack the site
        run: |
          mkdir -p _site
          for f in *.zip; do [ -e "$f" ] && unzip -o "$f" -d _site; done
          for f in *.html; do [ -e "$f" ] && cp "$f" _site/; done
          touch _site/.nojekyll
          ls -la _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
